name: horse-racing-system

# Stack: PostgreSQL 16 (named volume) + Node.js backend (Sequelize → postgres).
# All secrets are injected from the host's .env at the compose level — never
# baked into the image. `.env` is excluded by `.dockerignore`.

services:
  postgres:
    image: postgres:18-alpine
    container_name: horse-racing-postgres
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horse_racing}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-horse_racing}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: horse-racing-backend/Dockerfile
    container_name: horse-racing-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Use the docker-compose service name so DNS resolves to the postgres container.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-horse_racing}
      # Pass through secret-bearing values from the host .env if present.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      VND_PER_TOKEN: ${VND_PER_TOKEN:-1000}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:3000/payment-success}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost:3000/api/deposit/webhook/payment}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3000/api/deposit/webhook/payment}
      FRONTEND_PAYMENT_RETURN_URL: ${FRONTEND_PAYMENT_RETURN_URL:-http://localhost:5173/payment-success}
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:-SUPER_SECURE_MOCK_SECRET_12345}
      PROBABILITY_ENGINE_MODE: ${PROBABILITY_ENGINE_MODE:-local}
      PROBABILITY_ENGINE_URL: ${PROBABILITY_ENGINE_URL:-}
      PROBABILITY_ENGINE_PYTHON: ${PROBABILITY_ENGINE_PYTHON:-python}
      DB_AUTO_APPLY_SCHEMA: ${DB_AUTO_APPLY_SCHEMA:-true}
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"

volumes:
  postgres-data:
