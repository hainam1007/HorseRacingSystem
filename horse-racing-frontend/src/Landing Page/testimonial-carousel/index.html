<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Horse Racing Tournament Testimonials Carousel</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="tc-page">
    <section class="tc-container">
      <h2 class="tc-title">What's Riders Are Saying</h2>

      <div class="tc-carousel" id="tc-carousel">
        <button class="tc-nav tc-prev" aria-label="Previous">‹</button>

        <div class="tc-viewport">
          <div class="tc-track" id="tc-track">
            <!-- Slides injected by JS -->
          </div>
        </div>

        <button class="tc-nav tc-next" aria-label="Next">›</button>
      </div>

    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
